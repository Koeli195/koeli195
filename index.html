<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KOELI — Producer / Mixing / Mastering</title>

<meta name="description" content="KOELI — Music producer, mixing and mastering engineer based in Geneva, Switzerland.">

<style>
:root {
  --bg: #050505;
  --fg: #f2f2f2;
  --muted: #8a8a8a;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.container {
  width: min(1100px, 100%);
}

/* PHOTO */

.photo {
  width: 40%;
  aspect-ratio: 16 / 14;
  overflow: hidden;
  background: #111;
  margin-bottom: 32px;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  object-position: center 55%;
}

/* NAME */

h1 {
  margin: 0;
  font-size: clamp(70px, 15vw, 190px);
  line-height: .78;
  letter-spacing: -.08em;
  font-weight: 700;
}

/* INFO */

.info {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 30px;
  margin-top: 20px;
}

.role {
  font-size: 13px;
  letter-spacing: .12em;
  text-transform: uppercase;
  line-height: 1.7;
}

.location {
  color: var(--muted);
}

/* LINKS */

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}

.links a {
  border: 1px solid #333;
  padding: 12px 17px;
  border-radius: 100px;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  transition: .2s ease;
}

.links a:hover {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
}

/* FOOTER */

footer {
  position: fixed;
  bottom: 20px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* MOBILE */

@media (max-width: 700px) {

  main {
    padding: 18px;
    align-items: flex-start;
    padding-top: 55px;
  }

  .photo {
    width: 100%;
    aspect-ratio: 4 / 5;
    margin-bottom: 25px;
  }

  h1 {
    font-size: 24vw;
  }

  .info {
    display: block;
    margin-top: 25px;
  }

  .links {
    justify-content: flex-start;
    margin-top: 25px;
  }

  footer {
    position: static;
    margin: 50px 18px 20px;
  }
}
</style>
</head>

<body>

<main>

  <div class="container">

    <!-- YOUR PHOTO -->
    <div class="photo">
      <img src="images/koeli_music_producer.jpg" alt="KOELI in the studio">
    </div>

    <!-- NAME -->
    <h1>KOELI</h1>

    <div class="info">

      <div class="role">
        Music Producer<br>
        Mixing &amp; Mastering Engineer<br>
        <span class="location">Geneva, Switzerland</span>
      </div>

      <div class="links">

        <div class="links">
            <a href="about.html">About</a>
        </div>

        <!-- MUSIC -->
        <a href="https://open.spotify.com/artist/3yzCguQuh6muMmWj6tTflx"
           target="_blank"
           rel="noopener">
          Spotify
        </a>

        <!-- INSTAGRAM -->
        <a href="https://instagram.com/koelimusic"
           target="_blank"
           rel="noopener">
          Instagram
        </a>

        <!-- SOUNDCLOUD
        <a href="https://soundcloud.com/koeli-beats"
           target="_blank"
           rel="noopener">
          SoundCloud
        </a> -->

        <!-- BANDCAMP -->
        <a href="https://koeli.bandcamp.com/"
           target="_blank"
           rel="noopener">
          Bandcamp
        </a>

        <!-- SOUNDCLICK / BEATS
        <a href="https://www.soundclick.com/KoeliBeats"
           target="_blank"
           rel="noopener">
          Beats
        </a> -->

        <!-- CONTACT -->
        <a href="mailto:koelibeats@gmail.com">
          Contact
        </a>

      </div>

    </div>

  </div>

</main>

<footer>
  <span>© 2026 KOELI</span>
  <span>Producer / Engineer</span>
</footer>

</body>
</html>
